services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: science_data_catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog_dev_only
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d science_data_catalog"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - instance1_postgres:/var/lib/postgresql/data

volumes:
  instance1_postgres:
