name: Materializar navegação do explorador

on:
  push:
    branches: ["agent/federated-explorer-mvp"]
    paths:
      - "scripts/materialize_explorer_navigation.py"
      - ".github/workflows/materialize-explorer-navigation.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/federated-explorer-mvp
          fetch-depth: 0

      - name: Atualizar navegação pública
        run: python3 scripts/materialize_explorer_navigation.py

      - name: Validar páginas e explorador
        run: |
          python3 scripts/build_catalog.py
          python3 scripts/validate_frontend.py
          python3 scripts/validate_federated_explorer.py
          node --check assets/explorer.js
          python3 scripts/build_site_artifact.py

      - name: Remover materializador temporário
        run: |
          rm scripts/materialize_explorer_navigation.py
          rm .github/workflows/materialize-explorer-navigation.yml

      - name: Consolidar navegação na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html products.html analytics.html about.html scripts/materialize_explorer_navigation.py .github/workflows/materialize-explorer-navigation.yml
          git commit -m "UX: integrar explorador à navegação pública"
          git push origin HEAD:agent/federated-explorer-mvp
