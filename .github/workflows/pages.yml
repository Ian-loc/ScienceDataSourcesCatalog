name: Validar e publicar catálogo

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validar workflow de qualidade
        run: python3 scripts/validate_quality_correction_plan.py

      - name: Validar fila de candidatos
        run: python3 scripts/validate_candidate_queue.py

      - name: Validar prioridade territorial Brasil
        run: |
          python3 -m py_compile scripts/validate_brazil_scope.py
          python3 scripts/validate_brazil_scope.py

      - name: Validar catálogo de produtos
        run: python3 scripts/validate_product_catalog.py

      - name: Validar CSV e gerar artefatos derivados
        run: python3 scripts/build_catalog.py

      - name: Auditar papéis dos links
        run: python3 scripts/audit_link_roles.py

      - name: Validar evolução do esquema
        run: |
          python3 scripts/validate_schema_draft.py
          python3 scripts/validate_migration_matrix.py
          python3 scripts/validate_data1bx_matrix.py
          python3 scripts/load_data1bx_from_canonical.py

      - name: Validar lotes e evidências de revisão
        run: |
          python3 scripts/validate_br_batches.py
          python3 scripts/validate_br_completion.py
          python3 scripts/validate_external_review_evidence.py
          python3 scripts/validate_external_review_queue.py

      - name: Validar prontidão de release e DOI
        run: python3 scripts/validate_doi_readiness.py

      - name: Validar interface estática
        run: |
          python3 scripts/validate_frontend.py
          python3 scripts/validate_federated_explorer.py
          python3 scripts/validate_approaches_page.py
          node --check assets/app.js
          node --check assets/products.js
          node --check assets/explorer.js
          node --check assets/analytics.js
          node --check assets/quality-summary.js
          node --check assets/build-meta.js

      - name: Construir artefato público isolado
        run: |
          python3 -m py_compile scripts/build_site_artifact.py
          python3 scripts/build_site_artifact.py

      - name: Confirmar conteúdo publicável
        run: |
          test -s _site/index.html
          test -s _site/products.html
          test -s _site/explorer.html
          test -s _site/abordagens.html
          test -s _site/analytics.html
          test -s _site/about.html
          test -s _site/assets/app.js
          test -s _site/assets/explorer.js
          test -s _site/assets/explorer.css
          test -s _site/assets/approaches.css
          test -s _site/data/data_resources.csv
          test -s _site/data/data_resources.json
          test -s _site/data/data_products.json
          test -s _site/data/brazil_scope_priorities.json
          test -s _site/data/federated_layers.json
          test -s _site/data/build-meta.json
          test ! -e _site/WORKFLOW_STATUS.md
          test ! -e _site/IMPLEMENTATION_WORKFLOW.md
          test ! -e _site/migration
          test ! -e _site/scripts
          test ! -e _site/.github
          test ! -e _site/audit
          test ! -e _site/schema
          test ! -e _site/release

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Gerar dados e artefato público
        run: |
          python3 scripts/validate_candidate_queue.py
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py
          python3 scripts/validate_frontend.py
          python3 scripts/validate_federated_explorer.py
          python3 scripts/validate_approaches_page.py
          python3 scripts/build_site_artifact.py

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Registrar endereço publicado
        run: echo "Site publicado em ${{ steps.deployment.outputs.page_url }}"
