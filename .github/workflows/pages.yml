name: Validar e publicar catálogo

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validar workflow de qualidade
        run: python3 scripts/validate_quality_correction_plan.py

      - name: Validar fila de candidatos
        run: python3 scripts/validate_candidate_queue.py

      - name: Validar prioridade territorial Brasil
        run: |
          python3 -m py_compile scripts/validate_brazil_scope.py
          python3 scripts/validate_brazil_scope.py

      - name: Validar catálogo de produtos
        run: python3 scripts/validate_product_catalog.py

      - name: Validar direção científica e contratos
        run: |
          python3 -m py_compile scripts/validate_scientific_direction.py
          python3 -m py_compile scripts/validate_dynamic_world_operational_contract.py
          python3 -m py_compile scripts/validate_terraclass_release_scope_guard.py
          python3 scripts/validate_scientific_direction.py
          python3 scripts/validate_dynamic_world_operational_contract.py
          python3 scripts/validate_terraclass_release_scope_guard.py

      - name: Validar carga e promoção da Instância 1 sem banco
        run: |
          python3 -m py_compile scripts/load_instance1_staging.py
          python3 -m py_compile scripts/validate_instance1_database.py
          python3 -m py_compile scripts/promote_instance1_pilot.py
          python3 -m py_compile scripts/enrich_instance1_dynamic_world.py
          python3 -m py_compile scripts/enrich_instance1_dynamic_world_validation.py
          python3 -m py_compile scripts/enrich_instance1_terraclass.py
          python3 -m py_compile scripts/resolve_instance1_pilot_distributions.py
          python3 -m py_compile scripts/validate_instance1_pilot.py
          python3 -m py_compile scripts/validate_prodes_product_targets.py
          python3 scripts/load_instance1_staging.py --check-only
          python3 scripts/validate_prodes_product_targets.py

      - name: Validar CSV e gerar artefatos derivados
        run: python3 scripts/build_catalog.py

      - name: Auditar papéis dos links
        run: python3 scripts/audit_link_roles.py

      - name: Validar evolução do esquema
        run: |
          python3 scripts/validate_schema_draft.py
          python3 scripts/validate_migration_matrix.py
          python3 scripts/validate_data1bx_matrix.py
          python3 scripts/load_data1bx_from_canonical.py

      - name: Validar lotes e evidências de revisão
        run: |
          python3 scripts/validate_br_batches.py
          python3 scripts/validate_br_completion.py
          python3 scripts/validate_external_review_evidence.py
          python3 scripts/validate_external_review_queue.py

      - name: Validar prontidão de release e DOI
        run: python3 scripts/validate_doi_readiness.py

      - name: Validar interface estática
        run: |
          python3 scripts/validate_frontend.py
          python3 scripts/validate_federated_explorer.py
          python3 scripts/validate_approaches_page.py
          node --check assets/app.js
          node --check assets/products.js
          node --check assets/explorer.js
          node --check assets/analytics.js
          node --check assets/quality-summary.js
          node --check assets/build-meta.js

      - name: Construir artefato público isolado
        run: |
          python3 -m py_compile scripts/build_site_artifact.py
          python3 scripts/build_site_artifact.py

      - name: Confirmar conteúdo publicável
        run: |
          test -s _site/index.html
          test -s _site/products.html
          test -s _site/explorer.html
          test -s _site/abordagens.html
          test -s _site/analytics.html
          test -s _site/about.html
          test -s _site/assets/app.js
          test -s _site/assets/explorer.js
          test -s _site/assets/explorer.css
          test -s _site/assets/approaches.css
          test -s _site/data/data_resources.csv
          test -s _site/data/data_resources.json
          test -s _site/data/data_products.json
          test -s _site/data/brazil_scope_priorities.json
          test -s _site/data/federated_layers.json
          test -s _site/data/build-meta.json
          test ! -e _site/WORKFLOW_STATUS.md
          test ! -e _site/IMPLEMENTATION_WORKFLOW.md
          test ! -e _site/migration
          test ! -e _site/scripts
          test ! -e _site/.github
          test ! -e _site/audit
          test ! -e _site/schema
          test ! -e _site/database
          test ! -e _site/release

  instance1-database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: science_data_catalog
          POSTGRES_USER: catalog
          POSTGRES_PASSWORD: catalog_dev_only
          TZ: America/Sao_Paulo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catalog -d science_data_catalog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://catalog:catalog_dev_only@localhost:5432/science_data_catalog
    steps:
      - uses: actions/checkout@v4

      - name: Instalar cliente PostgreSQL
        run: python3 -m pip install -r database/requirements.txt

      - name: Criar esquema e carregar staging
        run: python3 scripts/load_instance1_staging.py --initialize

      - name: Comprovar idempotência da carga
        run: |
          output="$(python3 scripts/load_instance1_staging.py)"
          echo "$output"
          echo "$output" | grep -q '"status": "no_op"'

      - name: Promover piloto resolvido
        run: python3 scripts/promote_instance1_pilot.py

      - name: Comprovar idempotência da promoção
        run: python3 scripts/promote_instance1_pilot.py

      - name: Enriquecer Dynamic World V1
        run: |
          python3 scripts/enrich_instance1_dynamic_world.py
          python3 scripts/enrich_instance1_dynamic_world.py
          python3 scripts/enrich_instance1_dynamic_world_validation.py
          python3 scripts/enrich_instance1_dynamic_world_validation.py

      - name: Enriquecer TerraClass Amazônia 2020
        run: |
          python3 scripts/enrich_instance1_terraclass.py
          python3 scripts/enrich_instance1_terraclass.py

      - name: Resolver todas as distribuições piloto
        run: |
          python3 scripts/resolve_instance1_pilot_distributions.py
          python3 scripts/resolve_instance1_pilot_distributions.py

      - name: Validar integridade do staging
        run: python3 scripts/validate_instance1_database.py

      - name: Validar catálogo normalizado piloto
        run: python3 scripts/validate_instance1_pilot.py

  deploy:
    if: github.event_name != 'pull_request'
    needs: [validate, instance1-database]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Gerar dados e artefato público
        run: |
          python3 scripts/validate_candidate_queue.py
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/validate_scientific_direction.py
          python3 scripts/validate_dynamic_world_operational_contract.py
          python3 scripts/validate_terraclass_release_scope_guard.py
          python3 scripts/load_instance1_staging.py --check-only
          python3 scripts/validate_prodes_product_targets.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py
          python3 scripts/validate_frontend.py
          python3 scripts/validate_federated_explorer.py
          python3 scripts/validate_approaches_page.py
          python3 scripts/build_site_artifact.py

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Registrar endereço publicado
        run: echo "Site publicado em ${{ steps.deployment.outputs.page_url }}"
